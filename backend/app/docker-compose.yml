version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: career_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moorthy
      POSTGRES_DB: career_intel_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: